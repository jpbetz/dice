# dice.yaml — the declaration of the dice table.
#
# Every value here is a shipped default. Every leaf is optional: delete a
# line and the code's default stands. No leaf is a boolean: a two-state
# value is an enum with two named states. Developer mode reads this file,
# shows its leaves as dials, and Save rewrites ONLY the lines whose values
# changed — comments, order and blank lines stay as you wrote them.
# Labels, ranges, defaults and the look/film class of each dial: js/tune.js.

app:
  title: Dice Table
  mode: development        # development | production  (DICE_MODE overrides at deploy)
  version: 1               # bumped in the commit that renames or removes a key

table:
  scale: 2.5               # the one dial for table size (Joe 2026-09-01)
  ceilingY: 22             # the roof plane the walls close under
  seats:                   # the ring toss: aimed at the spot always, released behind it
    spot: 0.5              # the target, as a share of the radius from centre toward the chair
    back: 2.05              # release point behind the spot, along the chair's ray (table units)
    height: 0.8            # release height, a share of the hurl's 6–10 unit spawn
    speed: 0.12            # release speed, a share of the hurl's 14–22 units/s — a drop, not a throw
    box: 0.15              # scatter box around the spot, a share of the throw target box
    per: 1.5               # pool pitch, units between dice on the release line

light:
  lamp:
    y: 24                  # pool ~27 at the felt over a 13.75 table
    z: 1.5                 # over the felt, nudged to the front
    angle: 0.85            # widened 0.5 -> 0.85 for the round table (Joe 2026-09-02)
    penumbra: 0.75
    intensity: 2.8
    color: "#ffe8c4"
  room:                    # levels while the mood is on
    hemi: 0.1
    key: 1.7
    rim: 0.4
  fog:
    near: 15
    far: 46
  motes:                   # dust in the lamp cone (Joe 2026-08-15: "this looks good")
    state: enabled         # enabled | disabled
    count: 200
    size: 0.19
    peak: 0.07
    spread: 1.15
    rMax: 12
    yMin: 1.2
    yMax: 10               # not the full shaft: high motes read as a night sky
    fall: 0.35
    wander: 0.28
    twinkleHz: 0.11
  breath:                  # the declare beat, told in light; fractions of the shipped room
    state: enabled         # enabled | disabled
    dur: 0.6               # seconds, each way
    hemiDrop: 0.65         # the ambient falls furthest — it is what "closing in" is
    rimDrop: 0.75
    keyDrop: 0.45          # the key stays halfway: dice must not go unreadable
    lampLift: 0.12         # the pool comes UP, so it reads as focus not failure
    angleNarrow: 0.3
  tower:                   # the socketed tower's lantern rake and ember
    rakeIntensity: 2.4
    rakeColor: "#ffd9a0"
    rakeX: -10             # eye: side
    rakeY: 5.5             # eye: height
    rakeOut: 7.5           # eye: z0 + out
    rakeAngle: 0.62
    rakePenumbra: 0.6
    emberIntensity: 14
    emberDist: 8
    breathDepth: 0.22
    breathHz: 0.11
  life:                    # the fae venue's fireflies, wisps and moot (js/faelife.js)
    count: 260             # in-frame density, not total
    size: 0.5              # 0.2 was two device pixels; 0.5 reads as drifting specks
    peak: 0.42             # ~0.17 luma, under the tertiary ceiling of 0.25
    blinkPow: 4            # dark ~3/4 of the cycle
    blinkHz: 0.22          # a flash every 3–8 s
    wander: 0.45
    wispCount: 4           # one lead + three followers; a fifth would be a swarm
    wispSize: 1.15
    leadPeak: 0.95         # ~0.40 luma, inside secondary
    wispPeak: 0.38
    wispLoopSec: 78        # one lap; slow enough to be a route, not a track
    wispLampRange: 5.5
    wispLampGain: 2.2      # first dial to move if Joe finds it loud
    nearArcU: 0.3          # overridden by the venue
    leanGain: 0.35
    leanDwell: 0.55        # must stay < 1 or the route reverses
    dimGain: 0.3           # what survives while the film runs
    flareGain: 0.8         # the crit beat, on wisps
    moot:
      lapHz: 0.085         # a word goes round the ring in ~12 s
      quiet: 0.85
      visit: 0.45
      nearIn: 1.2          # standing in it, not passing near it
      nearOut: 3
      dimGain: 0.55
      flareGain: 0.5
      flareLap: 3

camera:
  framing:
    prefer: dice           # dice | table — what the fit favours when both cannot be held
    floor: 1               # the eye never comes closer than the zoom says
    gain: 1.15

throw:
  physics:
    gravity: -110          # slow motion by arithmetic; the tempo curve is the fix, not this
    solverIterations: 14
    floor: { friction: 0.6, restitution: 0.15 }
    dice: { friction: 0.4, restitution: 0.2 }
    wall: { friction: 0.2, restitution: 0.5 }
    damping: { linear: 0.01, angular: 0.01 }
  dampgate:                # felt damping only while a die is slow; gate 0 is off
    gate: 4
    slowLinear: 0.1
    slowAngular: 0.14
  sleep:                   # what dice.js already sets, not cannon's defaults
    speed: 0.4
    time: 0.35
  spawn:
    axis: clamp            # width | own | clamp — clamp shipped 2026-08-14, own measured and refused
    pad: 4.4               # the total clearance the clamp reserves
    per: 2.6               # the spacing the spread wants
  nudge:
    budget: 3
    lift: 7                # a vertical hurl
    spread: 4
    spin: 14
    cockedDot: 0.6         # ~53°: lets a die rest against its neighbour
    cockedDotD4: 0.7
    pileScale: 1.05        # tidy on (Joe 2026-08-11); 0 is off
    pileSpread: 12
  aim:                     # the seat's aim (js/places.js PLACE_AIM)
    state: enabled         # enabled | disabled
    speed: 0.5
    h: 0.45                # a low hand
    box: 0.25              # the fraction of the run the box is cut to
    corner: enabled        # enabled | disabled — a lane sets the box against its corner
    own: enabled           # enabled | disabled — the seat throws along its own axis
    spin: 1
  settle:
    mode: displacement     # velocity | displacement — displacement shipped 2026-08-11
    eps: 0.02              # a fraction of a die width
  target: 0.4              # the throw aims at the middle ±target/2 of the table

pace:
  tempo:                   # the projector's curve; never the bake
    k: 1
    flight: 0.8            # the tumble, a touch slower than raw
    settle: 25             # the tail is effectively skipped
    rampS: 2               # film seconds; the glide that hides the cut
    anchorSpeed: 8         # where tumbling ends, in units/s
  ceremony:                # read once at boot
    declareS: 1.35         # declaration dwell incl. the commit dock
    hitstopS: 0.11
    budgetS: 1.6           # post-settle ceiling
    dismissMs: 7000        # the flow-to-collected clock
  clear:
    sinkS: 0.3             # how long a cleared die takes to leave

sound:                     # look all the way down: what you hear off the film is yours
  master: 0.7              # the whole table's level; every voice is a fraction of it
  impact:
    gain: 0.06             # the DEFAULT contact body's level (felt) — most sounds this app makes
  click:
    mode: film             # film | wall — film is invariant to the tempo curve

post:
  bloom:
    threshold: 0.9         # linear pre-tonemap luminance a glow-flagged mesh must clear

cards:                     # the name card's footprint; the rig is re-baked at the placard flush
  standoff: 0.86           # the card centre outboard of the rim (standoff − depth/2 is the clear ground, and may not go below 0)
  width: 3.68              # across the chair's ray
  depth: 1.52              # along the chair's ray
  #
  # THE DRESS — what is DRAWN at that anchor, never where the anchor is. The
  # three above are film (two clients must agree on the ring); these are look,
  # per viewer, and switching them moves pixels and nothing else.
  style: embossed             # inlay: the name on the felt · stamp: pressed, in a thin rule · embossed: gold leaf with the ROLL flourishes · plate: a low plaque · tent: the folded card
  scale: 1.8                 # the size of the PRINTED thing (the card, or the band); width/depth above are the holder's
  flourish: none           # the EMBOSS's ornament — full: lozenge + rule · rule: the hairlines alone · none: the bare name
  inset: 4              # the bare styles: how far INSIDE the rim the ink lies, on the chair's own ray
  ink:                     # the flat styles print on their own transparent quad, so the ink can fade alone
    mode: steady           # steady: sits at rest · ghost: lifted to full by the roller's own wash
    rest: 0.75             # the ink's opacity when nothing is happening
    tone: ink              # the hand of the styles printed on the felt — ink: warm sepia (gold leaf on the emboss) · chalk: pale (silver leaf)
  wash:                    # the roller's hue on the ground under their name while their film plays
    state: enabled         # enabled | disabled — off makes attribution the seat alone
    peak: 1             # how bright the arc gets at the middle of the film

houses:                    # THE DICE CATALOGUE — every set the picker offers.
  #
  # A HOUSE is a browsing category with an identity; the SETS under `dice:`
  # are the concrete styles a player picks, and `house.set` is the id on the
  # wire. What each field MEANS, and why a set may have none of them, is
  # js/themes.js's header — it is the code that reads these, and it kept the
  # grammar when the recipes moved here (phase D1, 2026-09-03).
  #
  # Every field is optional and ABSENT IS A REAL ANSWER: sealed resin sheds
  # nothing, the fae dice make the ordinary knock, three sets write
  # `glow: null` to say the digits carry all the light. Defaults, ranges and
  # the look/film class of every field: js/tune.js RECIPE.

  # the control the themed houses read as themes against
  classics:
    label: Classics
    line: "unadorned dice — matte bodies, honest numbers"
    dice:
      ivory:
        label: Ivory
        body: "#f3ead7"
        text: "#2a2018"
        accent: "#d8c9a3"
        feel: { rough: 0.42, metal: 0 }
      ivorypips:
        label: Ivory (pips)
        body: "#f3ead7"
        text: "#1a1410"
        accent: "#d8c9a3"
        feel: { rough: 0.42, metal: 0 }
        glyph: pip
      onyx:
        label: Onyx
        body: "#141416"
        text: "#e8e2d2"
        accent: "#3a3a3f"
        feel: { rough: 0.48, metal: 0.03 }
        geo: { tint: "#e8e2d2", ink: 0.14 }
      slate:
        label: Slate
        body: "#4a4e56"
        text: "#f0e9d8"
        accent: "#2f3238"
        feel: { rough: 0.5, metal: 0.03 }
      crimson:
        label: Crimson
        body: "#7f1d1d"
        text: "#f0e9d8"
        accent: "#4a1010"
        feel: { rough: 0.42, metal: 0 }
      cobalt:
        label: Cobalt
        body: "#1e3a7a"
        text: "#f0e9d8"
        accent: "#122250"
        feel: { rough: 0.42, metal: 0 }
      emerald:
        label: Emerald
        body: "#1f4d2e"
        text: "#f0e9d8"
        accent: "#122d1c"
        feel: { rough: 0.42, metal: 0 }
      brass:
        label: Brass
        body: "#9b7a2a"
        text: "#221807"
        accent: "#c9a54a"
        feel: { rough: 0.32, metal: 0.72 }
        geo: { tint: "#3a2708", ink: 0.55 }

  # nothing under water sits still — the `swell` cadence is this house's
  tidewrack:
    label: Tidewrack
    line: ocean & odyssey — sea-glass and drowned bronze
    dice:
      seaglass:
        label: Sea-glass
        body: "#0e3a3f"
        text: "#7fd1c3"
        accent: "#8a6f3c"
        glow: { color: "#58e6d9", intensity: 0.07 }
        feel: { rough: 0.15, metal: 0.1 }
        shader: { fresnel: { color: "#58e6d9", power: 2.4, intensity: 0.9 } }
        spec: { iridescence: 0.15, iridescenceIOR: 1.3, envMapIntensity: 1 }
        geo: { bevel: 0.13, profile: round, wear: 0.6, pillow: 0.3 }
        decal: { kind: ring, colors: ["#071e22", "#a8dcd2"] }
        post: { bloom: source }
        sound: { body: chime, weight: 0.15, sustain: 40 }
        rest: { kind: swell, yAmpM: 0.0015, yPeriodS: 2.6, rollAmpRad: 0.00524, rollPeriodS: 3.1 }

  # living things: heartwood CREAKS and sapamber is `still` — the sentinel,
  # not a missing key, so the silence reads as a claim
  wildwood:
    label: Wildwood
    line: "forest, fae, dryadic — the house of living things"
    dice:
      heartwood:
        label: Heartwood
        body: "#5a4326"
        text: "#e9b54a"
        accent: "#6f8f4f"
        glow: { color: "#ffe9a3", intensity: 0.04 }
        feel: { rough: 0.72, metal: 0.05 }
        maps: { relief: { pattern: grain, strength: 0.9, digitDepth: 0.4 } }
        geo: { bevel: 0.09, profile: round, wear: 0.25, pillow: 0.35, tint: "#1a0a05", ink: 0.35 }
        sound: { body: thud, weight: 0.5, sustain: 20 }
        rate: { rate: 0.55, window: 0.15 }
        rest: { kind: creak, ampRad: 0.00698, periodAS: 2, periodBS: 3 }
      sapamber:
        label: Sap Amber
        body: "#96601f"
        text: "#38240e"
        accent: "#ffd166"
        glow: { color: "#ffb54d", intensity: 0.09 }
        feel: { rough: 0.08, metal: 0 }
        spec: { clearcoat: 0.55, clearcoatRoughness: 0.25, ior: 1.4, envMapIntensity: 1.05 }
        geo: { bevel: 0.1, profile: round, pillow: 0.5 }
        sound: { body: chime, weight: 0.2, sustain: 12 }
        rest: { kind: still }

  # one storm in one die. Its parented flicker was retired 2026-08-04: a
  # light is a consequence of an event, not an idle effect
  stormcall:
    label: Stormcall
    line: sky & tempest — a storm bottled in glass
    dice:
      boltglass:
        label: Bolt-glass
        body: "#3a4150"
        text: "#f2f6ff"
        accent: "#8f7fe8"
        glow: { color: "#8f7fe8", intensity: 0.09 }
        feel: { rough: 0.22, metal: 0.2 }
        shader: { flow: { speed: 2, scale: 12, floor: 0.2, amp: 1.4 } }
        spec: { iridescence: 0.35, envMapIntensity: 1.05 }
        particles: { kind: static, colors: ["#f2f6ff", "#b8a8ff"] }
        geo: { bevel: 0.03, nicks: 2 }
        post: { bloom: source, ring: { amp: 4 } }
        sound: { body: crackle, weight: 0.35, sustain: 25 }

  # ships ONE set on purpose — firstfrost went in the 2026-08-04 pass as
  # "deepglacier at brightness+1"; a frost-alt returns when it earns a real
  # differentiator (dendrites that GROW after settle, not baked ones)
  rimehold:
    label: Rimehold
    line: frost & glacier — the cold is the mechanic
    dice:
      deepglacier:
        label: Deep Glacier
        body: "#1e3d5c"
        text: "#eef4fa"
        accent: "#8fe3c0"
        glow: { color: "#a8d8f0", intensity: 0.06 }
        feel: { rough: 0.12, metal: 0.05 }
        maps: { relief: { pattern: ferns, strength: 0.85, digitDepth: 0.3 }, roughPattern: ferns }
        shader: { fresnel: { color: "#8fe3c0", power: 3.2, intensity: 0.55 } }
        spec: { envMapIntensity: 1.2, specularIntensity: 1.1 }
        particles: { kind: fog, colors: ["#dceefc", "#a8d8f0"] }
        geo: { bevel: 0.075, profile: round, wear: 0.15 }
        decal: { kind: frost, colors: ["#dceefc", "#7fb4d8"], scale: 1.35, life: 10 }
        post: { bloom: source }
        sound: { body: thud, weight: 0.85, sustain: 30 }
        rate: { rate: 0.4, window: 0.25 }

  # black iron, molten numbers: `glow: null` is the claim — the digits carry
  # ALL the fire, at 0.7 since the 2026-08-04 pass called 1.35 a neon sign
  emberforge:
    label: Emberforge
    line: "fire & the smith — black iron, molten numbers"
    dice:
      blackanvil:
        label: Black Anvil
        body: "#2b2622"
        text: "#ffd166"
        accent: "#ff8c42"
        glow: null
        feel: { rough: 0.85, metal: 0.55 }
        maps:
          digitGlow: { color: "#ffd166", intensity: 0.7 }
          relief: { pattern: hammer, strength: 1.1, digitDepth: 0.45 }
        shader: { flow: { speed: 0.9, scale: 12, cool: "#5a1c06", hot: "#fff2c8", gain: 1.4 } }
        spec: { specularColor: "#ffb073", specularIntensity: 0.9, envMapIntensity: 0.6 }
        particles: { kind: sparks, colors: ["#fff2c8", "#ffd166", "#ff9a3c"], fadeTo: "#571b05" }
        geo: { bevel: 0.1, wear: 0.2, nicks: 3 }
        decal: { kind: scorch, colors: ["#070402", "#ff8c42"] }
        light: { color: "#ff8c42", intensity: 10, range: 6.5, mode: breathe }
        post:
          bloom: source
          ring: { amp: 6, jolt: 2.5, speed: 1100 }
          shimmer: { radius: 2.2, strength: 0.7 }
        sound: { body: thud, weight: 0.9, sustain: 30 }

  # contained power. The 2026-08-04 pass dropped its breathing emissive and
  # pulled the rim and the die-light in: three signals for one identity slot
  arcanum:
    label: Arcanum
    line: runes & wizardry — the roll is a casting
    dice:
      focuscrystal:
        label: Focus Crystal
        body: "#2a2140"
        text: "#c9a6ff"
        accent: "#7fd9e8"
        glow: { color: "#7fd9e8", intensity: 0.08 }
        feel: { rough: 0.2, metal: 0.15 }
        maps: { digitGlow: { color: "#c9a6ff", intensity: 0.95 } }
        shader: { fresnel: { color: "#7fd9e8", power: 3, intensity: 0.3 } }
        spec: { ior: 1.75, specularIntensity: 1.25, envMapIntensity: 1.2 }
        particles: { kind: motes, colors: ["#c9a6ff", "#7fd9e8"], scale: 0.8 }
        geo: { bevel: 0.02 }
        light: { color: "#7fd9e8", intensity: 10, range: 2, mode: steady }
        post: { bloom: source }
        sound: { body: chime, weight: 0.3, sustain: 55 }

  # a die-shaped absence, so the violet halo went 1.1 → 0.45 (2026-08-04) —
  # a bright rim CONTRADICTS the claim the house is making
  umbra:
    label: Umbra
    line: dark & unnatural — a die-shaped absence
    dice:
      voidgrain:
        label: Void Grain
        body: "#0b0a10"
        text: "#cfe98c"
        accent: "#43265b"
        glow: { color: "#43265b", intensity: 0.05 }
        feel: { rough: 1, metal: 0 }
        maps: { digitGlow: { color: "#cfe98c", intensity: 0.85 } }
        shader:
          fresnel: { color: "#43265b", power: 2, intensity: 0.45 }
          dissolve: { edge: "#cfe98c" }
        particles: { kind: ash, colors: ["#5a4a6a", "#cfe98c"] }
        geo: { bevel: 0.015 }
        light: { color: "#ffffff", intensity: -8, range: 2.5, mode: breathe }
        post: { bloom: source, ring: { amp: -7 } }
        sound: { body: hush, weight: 0.4, sustain: 10 }

  # bone that remembers: the `settle-tick` — one small adjustment after
  # landing, then genuinely still forever
  reliquary:
    label: Reliquary
    line: "bone & relic — aged ivory, scrimshaw numbers"
    dice:
      scrimshaw:
        label: Scrimshaw
        body: "#e8dcc0"
        text: "#6b543a"
        accent: "#5f8f7a"
        glow: null
        feel: { rough: 0.6, metal: 0.05 }
        maps: { relief: { pattern: scrimshaw, strength: 0.95, digitDepth: 0.75 } }
        geo:
          bevel: 0.1
          profile: round
          wear: 0.45
          pillow: 0.25
          nicks: 4
          tint: "#4a3520"
          ink: 0.5
        decal: { kind: smudge, colors: ["#e8dcc0", "#c9b896"], scale: 0.85 }
        sound: { body: clack, weight: 0.55, sustain: 25 }
        rest:
          kind: settle-tick
          delayMinMs: 200
          delayMaxMs: 400
          posBumpM: 0.0003
          yawRad: 0.00698
          tailMs: 80

  # W4: staged by the fae venues, never picked — see `where` below
  moonmoot:
    label: Moonmoot
    line: the fae court at night — witchlight over still water
    dice:
      witchlight:
        label: Witchlight
        body: "#2f3b4c"
        text: "#d9fbee"
        accent: "#8ff0e2"
        glow: { color: "#7fc9b8", intensity: 0.06 }
        feel: { rough: 0.3, metal: 0.05 }
        maps:
          digitGlow: { color: "#d9fbee", intensity: 0.95 }
          relief: { pattern: grain, strength: 0.35, digitDepth: 0.7 }
        shader: { fresnel: { color: "#6fd8c8", power: 2.6, intensity: 0.5 } }
        spec: { ior: 1.56, envMapIntensity: 0.9 }
        geo: { bevel: 0.11, profile: round, wear: 0.35, pillow: 0.3, tint: "#141c26", ink: 0.2 }
        post: { bloom: source }
        rate: { rate: 0.7, window: 0.12 }
        rest: { kind: still }
        fog: { color: "#9ff0dc", gain: 1.25 }
        where: venue

  # MECHANICS M3/M6: d6 faces that are not all numbers
  symbols:
    label: Symbols
    line: faces that are not numbers — monster brawls and Fate
    dice:
      monster:
        label: Monster
        channel: beta
        body: "#e8e4dc"
        text: "#2f2a3a"
        accent: "#c9c2b4"
        feel: { rough: 0.34, metal: 0 }
        glyph: faces
        faces: ["1", "2", "3", bolt, claw, heart]
        geo: { bevel: 0.03 }
      fate:
        label: Fate
        line: "plus, minus, blank"
        body: "#2b3340"
        text: "#eef2f7"
        accent: "#8fa6c4"
        feel: { rough: 0.4, metal: 0 }
        glyph: faces
        faces: [minus, minus, blank, blank, plus, plus]
        geo: { bevel: 0.03 }
      kind:
        label: Kind
        line: "the generous cup — three plus, two blank, one minus"
        body: "#28402f"
        text: "#eef7f0"
        accent: "#8fc4a0"
        feel: { rough: 0.4, metal: 0 }
        glyph: faces
        faces: [minus, blank, blank, plus, plus, plus]
        geo: { bevel: 0.03 }
      cruel:
        label: Cruel
        line: "the mean cup — one plus, two blank, three minus"
        body: "#3a2530"
        text: "#f7eef2"
        accent: "#c48fa6"
        feel: { rough: 0.4, metal: 0 }
        glyph: faces
        faces: [minus, minus, minus, blank, blank, plus]
        geo: { bevel: 0.03 }

  # royal, and its dignity is stillness: lacquer sheds nothing, and the
  # ceremonial retiming (0.65× over the last 30%) is this house's own
  gildhall:
    label: Gildhall
    line: "royal & heraldic — oxblood lacquer, gold leaf"
    dice:
      oxblood:
        label: Oxblood
        body: "#4a1f1a"
        text: "#d4af37"
        accent: "#f3ead7"
        glow: null
        feel: { rough: 0.18, metal: 0.4 }
        spec: { clearcoat: 1, clearcoatRoughness: 0.12, envMapIntensity: 1.25 }
        geo: { bevel: 0.025 }
        sound: { body: clack, weight: 0.7, sustain: 20 }
        rate: { rate: 0.65, window: 0.3 }

felts:                     # THE MAT CATALOGUE — every cloth the swatch picker offers.
  #
  # A row is a NAME, a CLOTH and two colours: `feltBase` is the mat's own
  # colour and the seed its grain is drawn from, `sceneBg` the room behind it
  # and the fog's colour. `cloth` names the PAINTER (js/main.js FELT_CLOTHS —
  # `felt` when the row says nothing), and a new one is a function somebody
  # writes, not a row. Defaults, ranges and the class of every field:
  # js/tune.js FELT_ROW.
  #
  # `breath` is HOW FAR THIS CLOTH TAKES THE DECLARE BEAT (Joe, 2026-08-29), a
  # multiplier on `light.breath` above; absent means 1, the shipped beat. It
  # exists because one setting was measured wrong across the range: the beat
  # drops ambient to ~49%, which on `sand` reads as the room stepping back and
  # on `obsidian` moves about 14 levels of RGB, since half of near-black is
  # still near-black. The rule is simply that a darker cloth has less light to
  # lose, so it must lose a larger fraction of it. Ordered by how dark the
  # base is.
  emerald:
    name: Emerald
    feltBase: "#1f3128"
    sceneBg: "#191512"
    breath: 1.35
  crimson:
    name: Crimson
    feltBase: "#46201e"
    sceneBg: "#1a1211"
    breath: 1.15
  midnight:
    name: Midnight
    feltBase: "#1e2a3f"
    sceneBg: "#121520"
    breath: 1.35
  slate:
    name: Slate
    feltBase: "#2c3438"
    sceneBg: "#161a1c"
    breath: 1.25
  walnut:
    name: Walnut
    feltBase: "#402e1c"
    sceneBg: "#1b1410"
    breath: 1.15

  # The exploration batch (2026-07): more of the palette than green/brown —
  # near-black stone, cold deep teal, wine-dark purple, and one LIGHT table
  # (dice and gold chrome read differently on it by design).
  obsidian:
    name: Obsidian
    feltBase: "#1c1c24"
    sceneBg: "#0f0f13"
    breath: 1.5
  ocean:
    name: Ocean
    feltBase: "#16404a"
    sceneBg: "#0f181c"
    breath: 1.3
  plum:
    name: Plum
    feltBase: "#3b2342"
    sceneBg: "#160f18"
    breath: 1.3

  # The one light table: it needs the LEAST, and a full-strength beat here
  # takes it somewhere the other eight never go.
  sand:
    name: Sand
    feltBase: "#7c6a4d"
    sceneBg: "#211a11"
    breath: 0.8

  # THE FIRST MAT THAT IS NOT FELT (Joe's own seed). `cloth` names its
  # painter; every row above omits it and gets the default, so the nine that
  # shipped are untouched by construction. Stage one is look only — the
  # physics that makes sand DEADEN a throw is a separate, priced piece.
  #
  # `mottle` 0.45: the felt's nap catches light unevenly across the whole
  # table, but a raked bed is smoothed flat on purpose, so the same field at
  # full strength reads as damp patches rather than as nap.
  silt:
    name: Silt
    feltBase: "#a2977f"
    sceneBg: "#1a1712"
    breath: 0.85
    cloth: silt
    mottle: 0.45

  # THE HARD SURFACE, and the register's other end: every row above swallows
  # a die and this one hands it back. `mottle` 0.6 because a waxed board
  # catches light unevenly along its length, but far less than a nap does.
  taproom:
    name: Taproom
    feltBase: "#544530"
    sceneBg: "#191310"
    breath: 1.1
    cloth: oak
    mottle: 0.6

  # THE FIRST MAT NOBODY WROTE A PAINTER FOR (developer mode phase E2,
  # 2026-09-03). Joe: "make a new mat as YAML-only as a new dice set is now."
  # Every row above names one of three PAINTERS — a function in js/main.js —
  # so a new surface was still a code change wearing a row. `cloth: image`
  # takes the picture from a file instead, and these seven lines are the whole
  # of a mat that no line of code knows about.
  #
  # `texture` is served from this origin under models/ (server.js APP_DIRS,
  # and .gcloudignore ships models/). It rides NOWHERE on the wire: a felt id
  # is room state, but every client reads this same file through
  # /js/tunables.js and fetches the same path, so there is nothing to send.
  #
  # `tile` 1.25 is not a taste. models/mats/linen.png is 256px and the felt
  # tile is 1024px over 5 world units, so four repeats across the tile draw
  # the weave at 1:1 — one image pixel per texel. Ask for 5 and the same
  # picture is stretched fourfold and reads as a blur of it.
  #
  # `feltBase` MULTIPLIES the picture here rather than sitting under it (the
  # weave is a near-white greyscale), so it is a tint and a ceiling both: the
  # mat is this oat at the thread crowns and about 30% darker in the gaps.
  #
  # `gloss` and `sound` are the row saying what the picture cannot. A PNG has
  # no opinion about how a surface answers the lamp or what a die sounds like
  # landing on it, so `cloth: image` defaults to wool's answers to both and
  # this is where linen disagrees: matte, with less swing than a nap (it is
  # woven flat, not raised), and brighter and shorter-tailed than wool because
  # a thin cloth over a hard table is most of the way to the table. Every
  # field left out is the painter's — `gain` and `fizz` are not named here, so
  # they stay at the reference row.
  linen:
    name: Linen
    feltBase: "#8d7f66"
    sceneBg: "#221c14"
    breath: 0.8
    cloth: image
    texture: models/mats/linen.png
    tile: 1.25
    mottle: 0.7
    gloss: { mid: 0.94, swing: 0.06 }
    sound: { centre: 1.12, length: 1.1, tail: 1.25, grind: 1.1 }
