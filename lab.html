<!-- THE DICE LAB (Tier 6 §9, docs/THEMES.md) — dev chrome, not player UI.
     Every theme × every die type in one grid; effect trigger buttons per
     theme (each effect names its CAUSE); environment cycle to judge glows;
     one-click PNG capture. tools/lab-shots.mjs drives this headless. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dice Lab — themes</title>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "cannon-es": "./vendor/cannon-es.js"
  }
}
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14100c;
    font-family: system-ui, sans-serif; color: #f3ead7; user-select: none; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  #side {
    position: fixed; top: 0; left: 0; bottom: 0; width: 250px;
    padding: 10px 12px; overflow-y: auto;
    background: rgba(20, 15, 10, 0.92); border-right: 1px solid rgba(212,175,55,0.25);
  }
  h1 { font: 600 14px Georgia, serif; letter-spacing: 0.08em; text-transform: uppercase;
    color: #d4af37; margin: 2px 0 10px; }
  .theme { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .t-house { font: 600 12px Georgia, serif; letter-spacing: 0.08em; text-transform: uppercase;
    color: #d4af37; margin: 10px 0 0; }
  .t-name { font: 700 13px Georgia, serif; cursor: zoom-in; }
  .t-name:hover { text-decoration: underline dotted; }
  .t-name.zoomed { cursor: zoom-out; text-decoration: underline; }
  .t-line { font-size: 10px; color: #9c8f77; margin: 1px 0 5px; }
  .hint { font-size: 10px; line-height: 1.5; color: #9c8f77; margin: -6px 0 10px; }
  .fx { display: flex; flex-wrap: wrap; gap: 4px; }
  .fx button, #bar button {
    font-size: 11px; padding: 3px 8px; border-radius: 6px; cursor: pointer;
    border: 1px solid rgba(212,175,55,0.25); background: rgba(255,255,255,0.06); color: #f3ead7;
  }
  .fx button:hover, #bar button:hover { background: rgba(212,175,55,0.18); }
  #bar { position: fixed; top: 10px; right: 12px; display: flex; gap: 6px; z-index: 2; }
  .swatches { display: flex; gap: 3px; margin: 3px 0 5px; }
  .swatches i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.2); }
  /* the recipe readout: every knob a row runs on, at a glance */
  .t-recipe { font: 9.5px/1.5 ui-monospace, monospace; color: #9c8f77; margin: 2px 0 5px;
    overflow-wrap: break-word; }
  .t-recipe b { color: #c9b98a; font-weight: 600; }
  /* the set builder panel */
  #builder {
    position: fixed; top: 46px; right: 0; bottom: 0; width: 252px;
    padding: 8px 12px 12px; overflow-y: auto; z-index: 1;
    background: rgba(20, 15, 10, 0.92); border-left: 1px solid rgba(212,175,55,0.25);
  }
  #builder details { margin: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.07); padding-bottom: 4px; }
  #builder summary { font: 600 11px Georgia, serif; letter-spacing: 0.06em; text-transform: uppercase;
    color: #d4af37; cursor: pointer; margin: 4px 0; }
  .b-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; font-size: 11px; }
  .b-row label { flex: 0 0 78px; color: #cdbfa4; }
  .b-row input[type=range] { flex: 1; min-width: 0; accent-color: #d4af37; }
  .b-row input[type=color] { width: 34px; height: 20px; padding: 0; border: 1px solid rgba(255,255,255,0.2);
    background: none; border-radius: 4px; }
  .b-row select { flex: 1; min-width: 0; font-size: 11px; background: #241c12; color: #f3ead7;
    border: 1px solid rgba(212,175,55,0.25); border-radius: 4px; padding: 1px 2px; }
  .b-val { flex: 0 0 34px; text-align: right; font: 10px ui-monospace, monospace; color: #9c8f77; }
  #b-copy { width: 100%; margin-top: 6px; }
  #b-recipe { font: 9.5px/1.45 ui-monospace, monospace; color: #9c8f77; white-space: pre-wrap;
    overflow-wrap: break-word; background: rgba(255,255,255,0.04); border-radius: 6px; padding: 6px 8px; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="side"><h1>Dice Lab</h1>
    <div class="hint">click a die → hero view · name → row view ·
      ↑↓ same die across sets · ←→ die types · scroll dollies · esc grid</div>
  </div>
  <div id="bar">
    <button id="rotate">⟳ rotate: on</button>
    <button id="env">☀ env: table</button>
    <button id="bpanel">⚗ builder</button>
    <button id="shot">📷 capture</button>
  </div>
  <div id="builder">
    <div id="b-controls"></div>
    <button id="b-copy">⧉ copy recipe</button>
    <pre id="b-recipe"></pre>
  </div>
  <script type="module" src="js/lab.js"></script>
</body>
</html>
