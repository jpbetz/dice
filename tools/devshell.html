<!--
  DEVELOPER MODE — the shell (docs/DEVMODE.md §7). A standalone page that
  mounts the panel over a dark placeholder, with a fake cast and a fake bench
  that log their calls, so the panel can be LOOKED AT before main.js
  integration and the main session can take its screenshot. Served by the
  ordinary static path at /tools/devshell.html. No scene, no engine, no
  network — so the bench's numbers are DRESS, never measurements.

  window.__devShell = { panel, tune, calls } is the probe for the harness.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dev shell — dice table</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dev.css">
<style>
  /* the placeholder felt — the frame the panel overlays, not a scene */
  #shell {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 45% 60%, #1f3a22 0%, #0c120d 70%);
  }
  #shell-note {
    position: absolute; left: 24px; bottom: 20px; max-width: 420px;
    font: 12px/1.5 var(--font-mono); color: var(--muted); user-select: text;
  }
  #shell-note b { color: var(--ivory); }
  #shell-log {
    position: absolute; left: 24px; top: 20px; max-height: 40vh; overflow: auto;
    font: 11px/1.4 var(--font-mono); color: var(--gold-bright); white-space: pre; user-select: text;
  }
</style>
</head>
<body>
<div id="shell">
  <pre id="shell-log" aria-live="polite"></pre>
  <div id="shell-note"><b>dev shell</b> — the panel over a placeholder. The cast, the bench and the verbs log here. Press <b>`</b> or Esc to fold; the corner glyph unfolds.</div>
</div>
<script type="module">
  import { createTune } from '../js/tune.js';
  import { mount } from '../js/devmode.js';

  const logEl = document.getElementById('shell-log');
  const calls = [];
  const log = (line) => {
    calls.push(line);
    logEl.textContent = calls.slice(-18).join('\n');
    console.log('[devshell]', line);
  };

  // A slice of dice.yaml's shape, as the declaration would hand it over.
  // Every leaf here is one the dial tree names; anything the tree names and
  // this omits wears the "default" mark.
  const declared = {
    app: { title: 'Dice Table', mode: 'development' },
    table: { scale: 2.5 },
    light: {
      lamp: { y: 24, z: 1.5, angle: 0.85, penumbra: 0.75, intensity: 2.8, color: '#ffe8c4' },
      room: { hemi: 0.1, key: 1.7, rim: 0.4 },
      fog: { near: 15, far: 46 },
    },
    camera: { framing: { prefer: 'dice' } },
    throw: { physics: { gravity: -110 } },
    pace: { tempo: { k: 1 } },
  };

  const tune = createTune({ declared, source: '' });

  // The fake cast: eight chairs of nothing, logging every call.
  const cast = (() => {
    let rows = [];
    let seat = null;
    let overlay = 'disabled';
    const names = ['Ada', 'Bo', 'Cyrille', 'Dee', 'Étienne', 'Fen', 'Gudrun', 'Hal'];
    return {
      players: () => rows.length,
      seat: () => (seat === null ? null : { place: seat, name: rows[seat] }),
      deal: (n) => { rows = names.slice(0, n); seat = rows.length ? Math.min(seat ?? 0, rows.length - 1) : null; log(`deal(${n})`); },
      sit: (k) => { seat = k; log(`sit(${k})`); },
      reshuffle: () => { rows = rows.map((_, i) => names[(i + 3) % names.length]); log('reshuffle()'); },
      overlay: (state) => { overlay = state; log(`overlay(${state})`); },
      overlayState: () => overlay,
      roll: (k) => log(`roll(${k})`),
      rollAll: () => log('rollAll()'),
      state: () => ({ rows, seat, overlay }),
    };
  })();

  // The fake bench (phase 2): a clock that never runs a film, a seed box that
  // logs what it was asked for, and two A/B slots that hold the real diff. No
  // engine here, so nothing it says is a measurement — it is the DRESS of the
  // clock, bench and A/B sections, which is what the shell exists to show.
  const bench = (() => {
    const clock = { state: 'running', live: false, frame: 0, frames: 0, time: 0 };
    const ab = { a: null, b: null, live: null, film: false, replayed: false };
    let last = null;
    return {
      pool: '3d6',
      hud: () => ({ fps: 60, calls: 0, tris: 0, bodies: 0, settle: last ? last.settleS : null }),
      clock: () => clock,
      freeze: (s) => { clock.state = s; log(`freeze(${s})`); return clock; },
      step: () => { clock.frame++; log('step()'); return clock; },
      scrub: (f) => { log(`scrub(${f})`); return { ...clock, scrub: f }; },
      bench: (seed) => {
        const s = /^-?\d+$/.test(String(seed).trim()) ? Number(seed) : ((Date.now() * 2654435761) >>> 0);
        last = { seed: s, frames: 180, settleS: 3, bench: true, dice: ['d6', 'd6', 'd6'] };
        log(`bench(${JSON.stringify(seed)}) → seed ${s}`);
        return { seed: s, notation: '3d6 # bench', label: 'bench', place: 0, via: 'local' };
      },
      replay: () => {
        if (!last) return null;
        log(`replay() → seed ${last.seed}`);
        return { seed: last.seed, notation: '3d6 # bench', label: 'bench', place: 0, via: 'local' };
      },
      last: () => last,
      hold: (k) => { ab[k] = { changed: Object.keys(tune.changes()).length }; ab.live = k; log(`hold(${k})`); return ab; },
      apply: (k) => { if (!ab[k]) return null; ab.live = k; log(`apply(${k})`); return ab; },
      flip: () => {
        if (!ab.a || !ab.b) return null;
        ab.live = ab.live === 'a' ? 'b' : 'a';
        log(`flip() → ${ab.live}`);
        return ab;
      },
      ab: () => ab,
    };
  })();

  const verbs = {
    download: () => log(`download() → ${tune.patchText().split('\n').length - 1} lines`),
    copyPatch: () => log(`copyPatch() → ${JSON.stringify(tune.changes())}`),
  };

  const panel = mount({
    tune, cast, bench, verbs,
    onFold: (on) => log(`fold(${on})`),
    onShut: () => { log('shut()'); tune.reset('all'); panel.repaint(); },
    info: { declared, venue: null },
  });
  panel.setFooter({ fps: 60, calls: 0 });

  // The door's key, so the shell folds and unfolds the way the table will.
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Backquote' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      const on = !panel.isFolded();
      panel.fold(on);
      log(`fold(${on})`);
    }
  });

  window.__devShell = { panel, tune, calls, cast, bench };
</script>
</body>
</html>
