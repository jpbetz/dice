<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dice Table</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "cannon-es": "./vendor/cannon-es.js"
  }
}
</script>
</head>
<body>
  <div id="scene-container"></div>

  <!-- Left panel: tray builder + saved groups -->
  <aside id="left-panel">
    <div class="panel" id="builder-panel">
      <h1 class="app-title">⚄ Dice Table</h1>
      <h2>Build a tray</h2>
      <div id="die-buttons"></div>
      <div id="tray" class="chip-row" title="Click a chip to remove it"></div>
      <div class="btn-row">
        <button id="roll-tray" class="btn primary" disabled>Roll</button>
        <button id="clear-tray" class="btn" disabled>Empty</button>
      </div>
      <div class="btn-row">
        <input id="group-name" type="text" placeholder="Name this group…" maxlength="24">
        <button id="save-group" class="btn" disabled>Save</button>
      </div>
    </div>

    <div class="panel" id="groups-panel">
      <h2>Saved groups <button id="copy-link" class="btn tiny ghost" title="Copy a URL that restores these groups anywhere">copy link</button></h2>
      <div id="groups-list"></div>
      <p id="groups-empty" class="hint">Save a tray to keep it here for quick rerolls.</p>
    </div>
  </aside>

  <!-- Top-right controls -->
  <div id="top-controls">
    <span id="status-pill" class="hidden"></span>
    <button id="toggle-mini" class="btn ghost" title="Compact view: just the table and group buttons">Mini</button>
    <button id="toggle-log" class="btn ghost" title="Show/hide roll log">Log</button>
    <button id="toggle-sound" class="btn ghost" title="Toggle sound">🔊</button>
    <button id="clear-table" class="btn ghost" title="Remove all dice from the table">Clear table</button>
  </div>

  <!-- Mini-mode strip: group pills + clear + expand -->
  <div id="mini-bar"></div>

  <!-- Right-side stack: players + roll log -->
  <div id="right-stack">
    <div id="players-panel" class="panel hidden">
      <h2>Players</h2>
      <div id="players-list"></div>
    </div>

    <!-- Roll log -->
    <aside id="log-panel" class="panel">
      <h2>Roll log <button id="clear-log" class="btn tiny ghost">clear</button></h2>
      <div id="log-list"></div>
      <p id="log-empty" class="hint">No rolls yet.</p>
    </aside>
  </div>

  <!-- Result banner -->
  <div id="result-banner" class="hidden">
    <div id="result-label"></div>
    <div id="result-total"></div>
    <div id="result-meaning"></div>
    <div id="result-breakdown"></div>
  </div>

  <!-- Per-die floating value chips -->
  <div id="chips-layer"></div>

  <!-- Critical effect overlay -->
  <div id="crit-overlay" class="hidden">
    <div id="crit-text"></div>
  </div>

  <!-- Display-name modal (multiplayer identity) -->
  <div id="name-modal" class="hidden">
    <div class="panel" id="name-panel">
      <h2>Take a seat</h2>
      <p class="hint">Pick a display name for the table.</p>
      <div class="btn-row">
        <input id="name-input" type="text" placeholder="Display name…" maxlength="24" autocomplete="off">
        <button id="name-join" class="btn primary" disabled>Join</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
